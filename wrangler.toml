# Cloudflare Pages project config (source of truth for bindings once committed).
# Generated from the live project with `wrangler pages download config tender-atlas`, plus the D1 binding.
# Secrets are NOT stored here: set them with `bunx wrangler pages secret put NAME --project-name tender-atlas`.
name = "tender-atlas"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-17"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "tender-atlas"
database_id = "9ffda723-5a30-45e9-8434-9ded260134db"
migrations_dir = "migrations"

# Public (non-secret) settings for paid dossiers. Checkout stays closed automatically
# until every secret below is also set (see src/lib/dossier/checkout.ts availability()):
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, TURNSTILE_SECRET_KEY, RESEND_API_KEY, NOTIFICATION_TO_EMAIL
[vars]
STRIPE_PRICE_ID = "price_1Ud77vByiix0wtyTAeUNiy5Z"
NOTIFICATION_FROM_EMAIL = "Tender Atlas <orders@tenderatlas.shop>"
DOSSIER_SALES_OPEN = "true"
