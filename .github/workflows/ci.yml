name: TenderAtlas v10.6 quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Ensure no secret files are tracked
        shell: bash
        run: |
          if git ls-files | grep -E '^(\.dev\.vars($|\.)|\.env($|\.(local|production|staging|development|test)($|\.))|\.wrangler/|node_modules/)'; then
            echo 'A secret or generated folder is tracked'; exit 1
          fi
