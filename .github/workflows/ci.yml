name: Quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Check secret files are not committed
        shell: bash
        run: |
          # Do not flag the documented .env.example template; it contains no live secrets.
          if git ls-files | grep -E '^(\.dev\.vars($|\.)|\.env($|\.(local|production|staging|development|test)($|\.))|\.wrangler/|node_modules/)'; then
            echo 'Refusing to build: a local secret or generated directory is tracked.'
            exit 1
          fi
