name: Daily opt-in tender alerts
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch only if secrets configured
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo 'Alert delivery not configured; exiting safely.'
            exit 0
          fi
          curl --fail --silent --show-error --max-time 200 --retry 2 \
            -X POST "${APP_URL%/}/api/admin/dispatch" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
