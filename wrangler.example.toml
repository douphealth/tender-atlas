# Copy to wrangler.toml on the owner's Cloudflare deployment and replace every placeholder.
name = "tender-atlas"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_compat"]
main = ".output/server/index.mjs"

[assets]
directory = ".output/client"

[[d1_databases]]
binding = "DB"
database_name = "tender-atlas"
database_id = "REPLACE_WITH_OWNER_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["17 */6 * * *", "7 6 * * *"]

# Set secrets with: wrangler secret put SAM_GOV_API_KEY
# Optional: TURNSTILE_SECRET_KEY, RESEND_API_KEY, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_ID, CRON_SECRET
# Public build variables: VITE_SITE_URL, VITE_TURNSTILE_SITE_KEY
# Plain vars: NOTIFICATION_FROM_EMAIL, NOTIFICATION_TO_EMAIL
